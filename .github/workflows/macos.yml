name: macOS

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Build Environment
        run: ./ck tools setup
      - name: Install Externs
        run: |
          mkdir -p .cutekit
          cp -R _externs .cutekit/externs
      - name: Build Libraries
        run: ./ck build --props:async=kevent
      - name: Test Libraries
        timeout-minutes: 20
        continue-on-error: true
        run: ./ck test --props:async=kevent
      - name: Run html5lib Lexer Tests
        timeout-minutes: 20
        continue-on-error: true
        run: ./ck html5lib-tests run -s tokenizer --props:async=kevent
      - name: Run html5lib Parser Tests
        timeout-minutes: 20
        continue-on-error: true
        run: ./ck html5lib-tests run -s tree_construction --props:async=kevent
      - name: Run Reftests
        timeout-minutes: 30
        continue-on-error: true
        run: ./ck reftests run --headless --props:async=kevent
