name: macOS

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Build Environment
        run: ./ck tools setup
      - name: Install Externs
        timeout-minutes: 5
        run: |
          ./ck sync
          if [ -d _vendor/karm ]; then rsync -a _vendor/karm/ .cutekit/externs/skift/karm/; fi
      - name: Build Libraries
        run: ./ck build --props:async=kevent
      - name: Debug hang
        run: |
          ./ck build --props:async=kevent __tests__ > /dev/null 2>&1
          BIN=$(ls .cutekit/build/host-arm64-*/karm-test.main/__bin__/* | head -1)
          echo "bin: $BIN"
          for g in "empty-body" "async-*"; do
            echo "===== $g"
            "$BIN" -g "$g" &
            PID=$!
            for i in $(seq 60); do kill -0 $PID 2>/dev/null || break; sleep 1; done
            if kill -0 $PID 2>/dev/null; then
              echo "===== HANG ($g), backtrace:"
              sudo lldb -p $PID --batch -o "thread backtrace all" 2>&1 | head -300
              kill -9 $PID
            else
              wait $PID; echo "exit: $?"
            fi
          done
